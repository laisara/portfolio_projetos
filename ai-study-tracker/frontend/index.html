<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Engineer Study Tracker</title>
  <meta name="description" content="Jornada pessoal de AI Agent Engineering: aprender, entender, construir, revisar e consolidar.">
  <meta name="theme-color" content="#0a0d0c">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="offline-banner" role="status">Sem conexão com o servidor local — exibindo os últimos dados salvos.</div>
  <div id="sprite" aria-hidden="true"></div>
  <div class="app">
    <aside class="sidebar" aria-label="Navegação principal">
      <a class="brand" href="#/">
        <img src="/icons/icon-192.png" alt="">
        <div><b>AI Engineer</b><span>Study Tracker</span></div>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <main>
      <div id="view" class="view" tabindex="-1" aria-live="polite"></div>
    </main>
  </div>
  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <div id="overlay"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
