<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Smart Hub — Diagnóstico de plataforma</title>
  <!--
    Página autocontida para os testes H-03 e H-04 (docs/FEASIBILITY.md):
    detecta recursos do navegador e registra o keyCode de cada tecla.
    Não envia nada pela rede; os resultados são lidos/fotografados na tela.
    Escrita em ES3/ES5 conservador para rodar no navegador mais antigo possível.
  -->
  <style>
    body { margin: 0; padding: 36px 64px; background: #0d0f12; color: #f2f4f7;
      font-family: Tahoma, Arial, sans-serif; font-size: 22px; }
    h1 { font-size: 30px; margin: 0 0 16px 0; }
    h2 { font-size: 24px; margin: 20px 0 8px 0; color: #22d3ee; }
    td { padding: 2px 16px 2px 0; vertical-align: top; }
    .ok { color: #6ee0b5; } .no { color: #ff9a9a; }
    #keys { font-family: monospace; font-size: 24px; }
    #ua { font-size: 16px; color: #aab2bd; word-wrap: break-word; }
  </style>
</head>
<body>
  <h1>Diagnóstico de plataforma</h1>
  <div id="ua"></div>
  <h2>Recursos</h2>
  <table id="features"></table>
  <h2>Teclas (pressione cada tecla do controle)</h2>
  <div id="keys">Nenhuma tecla recebida ainda.</div>

  <script>
    (function () {
      var results = [];

      function check(name, fn) {
        var ok = false;
        try { ok = !!fn(); } catch (e) { ok = false; }
        results.push([name, ok]);
      }

      check('JSON', function () { return window.JSON && JSON.parse('{"a":1}').a === 1; });
      check('Array.prototype.forEach (ES5)', function () { return typeof [].forEach === 'function'; });
      check('Object.keys (ES5)', function () { return typeof Object.keys === 'function'; });
      check('Function.prototype.bind (ES5)', function () { return typeof Function.prototype.bind === 'function'; });
      check('addEventListener', function () { return typeof document.addEventListener === 'function'; });
      check('localStorage gravável', function () {
        localStorage.setItem('__diag__', '1');
        var v = localStorage.getItem('__diag__');
        localStorage.removeItem('__diag__');
        return v === '1';
      });
      check('CSS transform (com ou sem -webkit-)', function () {
        var s = document.body.style;
        return 'transform' in s || 'webkitTransform' in s;
      });
      check('CSS transition (com ou sem -webkit-)', function () {
        var s = document.body.style;
        return 'transition' in s || 'webkitTransition' in s;
      });
      check('navigator.onLine', function () { return typeof navigator.onLine === 'boolean'; });
      check('Objeto Common (API legada Samsung?)', function () { return typeof window.Common !== 'undefined'; });

      var table = document.getElementById('features');
      var i, row, a, b;
      for (i = 0; i < results.length; i++) {
        row = table.insertRow(-1);
        a = row.insertCell(-1);
        b = row.insertCell(-1);
        a.appendChild(document.createTextNode(results[i][0]));
        b.className = results[i][1] ? 'ok' : 'no';
        b.appendChild(document.createTextNode(results[i][1] ? 'sim' : 'não'));
      }

      document.getElementById('ua').appendChild(document.createTextNode(
        'Agente: ' + navigator.userAgent + ' · Janela: ' + window.innerWidth + '×' + window.innerHeight));

      var log = [];
      function onKey(e) {
        e = e || window.event;
        log.unshift(e.type + ' keyCode=' + e.keyCode + (e.key ? ' key=' + e.key : ''));
        if (log.length > 10) { log.pop(); }
        document.getElementById('keys').innerHTML = log.join('<br>');
      }
      if (document.addEventListener) {
        document.addEventListener('keydown', onKey, false);
      } else {
        document.onkeydown = onKey;
      }
    })();
  </script>
</body>
</html>
